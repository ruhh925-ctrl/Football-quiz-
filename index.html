   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Football Career - 50 Levels</title>
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=200">
    <link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=200">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            --card-bg: rgba(15, 23, 42, 0.9);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .quiz-container { width: 100%; max-width: 650px; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        .intro-screen { text-align: center; padding: 10px 0; }
        .intro-logo { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; border: 3px solid var(--accent-gold); margin: 0 auto 15px auto; box-shadow: 0 0 25px rgba(251, 191, 36, 0.5); }
        .intro-screen h1 { font-size: 2.2rem; margin-bottom: 10px; background: linear-gradient(135deg, #fbbf24, #f43f5e, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .intro-screen p { color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; font-size: 0.95rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .level-badge { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .stats { display: flex; gap: 15px; font-size: 0.9rem; color: var(--text-muted); }
        .stats span { color: var(--accent-gold); font-weight: bold; }
        .question-box { margin-bottom: 20px; }
        .question-box h2 { font-size: 1.25rem; line-height: 1.4; margin-bottom: 8px; color: #fff; }
        .question-meta { font-size: 0.85rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .options-grid { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 14px 18px; text-align: left; border-radius: 12px; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; }
        .option-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--accent-blue); transform: translateY(-2px); }
        .footer-controls { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .control-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
        .control-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .control-btn.quit { color: var(--accent-red); border-color: rgba(248, 113, 113, 0.3); }
        .control-btn.quit:hover { background: rgba(248, 113, 113, 0.2); }
        .action-btn { background: linear-gradient(135deg, #34d399, #059669); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(52,211,153,0.4); }
        .action-btn:hover { transform: translateY(-2px); }
        .rewards-container { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .reward-card { background: rgba(0,0,0,0.5); border: 2px solid var(--accent-gold); border-radius: 12px; padding: 12px; text-align: center; flex: 1; }
        .reward-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 2px solid var(--accent-gold); margin-bottom: 8px; }
        .reward-card h3 { color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 3px; }
        .reward-card p { font-size: 0.75rem; color: var(--text-muted); margin: 0; }
    </style>
</head>
<body>

    <div class="quiz-container" id="app">
        <div class="intro-screen">
            <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=200" alt="Ball" class="intro-logo">
            <h1>Ultimate Football Career</h1>
            <p>50 progressive levels with unique challenges, audio effects, increasing difficulty, and ultimate rewards: the <strong>Trionda Ball</strong> & <strong>GOAT Messi Card</strong>!</p>
            <button class="action-btn" onclick="initGameAudio()">Start Game & Enable Audio 🎵⚽</button>
        </div>
    </div>

    <script>
        let audioCtx = null;

        function initGameAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            playNote(523.25, 0.1);
            setTimeout(() => playNote(659.25, 0.15), 100);
            startQuiz();
        }

        function playNote(freq, duration) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const questionBank = [
            { q: "Which country won the first-ever FIFA World Cup in 1930?", opts: ["Brazil", "Uruguay", "Argentina", "Italy"], ans: 1 },
            { q: "Who holds the record for most goals in a single calendar year?", opts: ["Lionel Messi", "Cristiano Ronaldo", "Pele", "Gerd Muller"], ans: 0 },
            { q: "Which club won 3 consecutive UEFA Champions Leagues from 2016 to 2018?", opts: ["Barcelona", "Bayern Munich", "Real Madrid", "Liverpool"], ans: 2 },
            { q: "Who is the all-time top goalscorer in the UEFA Champions League?", opts: ["Robert Lewandowski", "Lionel Messi", "Karim Benzema", "Cristiano Ronaldo"], ans: 3 },
            { q: "Which nation is known as 'De Rode Duivels' (The Red Devils)?", opts: ["Belgium", "England", "South Korea", "Denmark"], ans: 0 },
            { q: "Which player has won the most Ballon d'Or awards in history?", opts: ["Cristiano Ronaldo", "Lionel Messi", "Johan Cruyff", "Michel Platini"], ans: 1 },
            { q: "Which stadium is known as the 'Theatre of Dreams'?", opts: ["Anfield", "Camp Nou", "Old Trafford", "Wembley"], ans: 2 },
            { q: "Which country won the 2022 FIFA World Cup in Qatar?", opts: ["France", "Brazil", "Argentina", "Germany"], ans: 2 },
            { q: "Who scored the famous 'Hand of God' goal in the 1986 World Cup?", opts: ["Pelé", "Diego Maradona", "Zinedine Zidane", "Ronaldo Nazário"], ans: 1 },
            { q: "Which team won the English Premier League Invincibles season without losing a match?", opts: ["Manchester United", "Chelsea", "Manchester City", "Arsenal"], ans: 3 }
        ];

        const levelsData = [];
        const difficulties = ["Warm-up Tier", "Club Tier", "National Tier", "Elite Tier", "Legendary Tier"];

        for (let l = 1; l <= 50; l++) {
            let tierIndex = Math.floor((l - 1) / 10);
            let levelQuestions = [];
            for (let q = 0; q < 5; q++) {
                let bankItem = questionBank[(l * 3 + q) % questionBank.length];
                levelQuestions.push({
                    question: `Lvl ${l} (Q${q+1}): ${bankItem.q}`,
                    options: bankItem.opts,
                    answer: bankItem.ans
                });
            }
            levelsData.push({
                level: l,
                tier: difficulties[tierIndex],
                questions: levelQuestions
            });
        }

        let currentLevelIndex = 0;
        let currentQIndex = 0;
        let score = 0;

        function startQuiz() {
            currentLevelIndex = 0;
            currentQIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const levelObj = levelsData[currentLevelIndex];
            if (currentQIndex >= levelObj.questions.length) {
                currentLevelIndex++;
                currentQIndex = 0;
                if (currentLevelIndex >= levelsData.length) {
                    playVictoryFanfare();
                    showVictoryScreen();
                    return;
                }
            }

            const activeLevel = levelsData[currentLevelIndex];
            const q = activeLevel.questions[currentQIndex];
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="header">
                    <div class="level-badge">Level ${activeLevel.level} / 50</div>
                    <div class="stats">Tier: <span>${activeLevel.tier}</span> | Score: <span>${score}</span></div>
                </div>
                <div class="question-box">
                    <div class="question-meta">Question ${currentQIndex + 1} of 5</div>
                    <h2>${q.question}</h2>
                </div>
                <div class="options-grid">
                    ${q.options.map((opt, index) => `
                        <button class="option-btn" onclick="handleAnswer(${index})">${opt}</button>
                    `).join('')}
                </div>
                <div class="footer-controls">
                    <button class="control-btn" onclick="resetQuiz()">Reset Progress</button>
                    <button class="control-btn quit" onclick="quitQuiz()">Quit to Menu</button>
                </div>
            `;
        }

        function handleAnswer(selectedIndex) {
            playNote(400, 0.08);
            const activeLevel = levelsData[currentLevelIndex];
            const q = activeLevel.questions[currentQIndex];
            
            if (selectedIndex === q.answer) {
                score += 10;
            }
            currentQIndex++;
            loadQuestion();
        }

        function resetQuiz() {
            if(confirm("Reset progress back to Level 1?")) {
                startQuiz();
            }
        }

        function quitQuiz() {
            if(confirm("Return to main menu?")) {
                location.reload();
            }
        }

        function playVictoryFanfare() {
            setTimeout(() => playNote(523.25, 0.2), 0);
            setTimeout(() => playNote(659.25, 0.2), 200);
            setTimeout(() => playNote(783.99, 0.3), 400);
            setTimeout(() => playNote(1046.50, 0.6), 600);
        }

        function showVictoryScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="intro-screen">
                    <h1>GLORY! 50 LEVELS CONQUERED! 🏆</h1>
                    <p>You completed all 50 levels with a final score of <strong>${score} points</strong> and unlocked ultimate status!</p>
                    
                    <div class="rewards-container">
                        <div class="reward-card">
                            <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=200" alt="Trionda Ball">
                            <h3>Trionda Ball</h3>
                            <p>Elite match ball.</p>
                        </div>
                        <div class="reward-card">
                            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=200" alt="GOAT Messi Card">
                            <h3>GOAT Messi</h3>
                            <p>Exclusive card.</p>
                        </div>
                    </div>

                    <button class="action-btn" onclick="startQuiz()" style="margin-top: 15px;">Play Career Again 🔄</button>
                </div>
            `;
        }
    </script>
</body>
</html>
